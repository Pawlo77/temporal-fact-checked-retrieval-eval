name: Pytest

# No path filters: `tests-passed` is a required status check, and a workflow
# skipped by a path filter never reports it, which would block unrelated PRs.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    env:
      # Overrides the tracked .python-version so `uv run` keeps the matrix interpreter.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          version: "0.12.23"

      - name: Set up Python
        run: uv python install "$UV_PYTHON"

      - name: Sync dependencies
        run: uv sync --locked --all-groups --python "$UV_PYTHON"

      - name: Run pytest with coverage
        run: uv run pytest --cov=./src/temporal_fact_checked_retrieval_eval --cov-report=xml tests/

      - name: Upload coverage to Codecov
        if: matrix.python == '3.12'
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  tests-passed:
    # Single required status check for branch protection.
    name: tests-passed
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a test job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "A required test job did not succeed." >&2
          exit 1

      - name: All test jobs succeeded
        run: echo "All test jobs succeeded."
